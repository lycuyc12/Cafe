<title>Кафе</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;600&family=Nunito:wght@400;700&family=Cinzel:wght@500;600&display=swap" rel="stylesheet">
<style id="base">
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--font);transition:background .3s}
#page{max-width:460px;margin:0 auto;padding:18px 18px 50px;text-align:center}
.lang{display:flex;justify-content:flex-end;gap:6px;margin-bottom:10px}
.lang button{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:99px;padding:5px 11px;font:600 12px var(--font);cursor:pointer}
.lang button.on{background:var(--accent);color:var(--card)}
.logo{width:96px;height:96px;margin:6px auto 14px;color:var(--accent);display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;user-select:none}
.logo img{width:100%;height:100%;object-fit:contain;border-radius:50%}
.logo svg{width:100%;height:100%}
.logo.w{width:170px;height:139px}.logo.w img{border-radius:0}
h1{margin:0;font-size:32px;font-weight:600;letter-spacing:var(--ls)}
.tag{margin:6px 0 22px;opacity:.7;font-size:15px}
.promo{display:flex;align-items:center;gap:12px;text-align:left;padding:14px 16px;margin-bottom:12px;border:1.5px dashed color-mix(in srgb,var(--text) 30%,transparent);border-radius:calc(var(--r) + 6px);font-size:14px;opacity:.9}
.ic{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid color-mix(in srgb,var(--text) 25%,transparent);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.ic svg{width:21px;height:21px}.ic.s{width:30px;height:30px;border:0}.ic.s svg{width:22px;height:22px}
.row,.tile{display:flex;align-items:center;gap:14px;width:100%;padding:12px 16px;margin-bottom:12px;background:var(--card);color:var(--text);border:1px solid color-mix(in srgb,var(--text) 16%,transparent);border-radius:calc(var(--r) + 14px);font:600 16px var(--font);text-decoration:none;text-align:left;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.05)}
.row .lb{flex:1}.row .ch{width:18px;height:18px;opacity:.55}
body.outline .row,body.outline .tile{background:transparent;box-shadow:none}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}.tiles.one{grid-template-columns:1fr}
.tile{flex-direction:column;justify-content:center;margin:0;padding:18px 10px;border-radius:calc(var(--r) + 6px);text-align:center;gap:10px;font-size:15px}
.hrs{cursor:default}.hrs small{display:block;font-weight:400;opacity:.6;font-size:12px}
.mi{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed rgba(128,128,128,.35);text-align:left}.mi:last-child{border:0}.mi b{white-space:nowrap}
.btn{display:block;width:100%;padding:14px 16px;border-radius:calc(var(--r) - 6px);border:1.5px solid var(--accent);background:var(--accent);color:var(--card);font:600 15px var(--font);cursor:pointer;margin-bottom:10px}
.btn.o{background:transparent;color:var(--accent)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.on{display:flex}
.panel{background:#fff;color:#222;font:14px system-ui,sans-serif;width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.panel h3{margin:0 0 10px;font-size:17px}
.panel h4{margin:18px 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#777}
.panel label{display:block;margin:8px 0 3px;color:#555;font-size:13px}
.panel input[type=text],.panel input[type=password],.panel input[type=url],.panel select,.panel textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:10px;font:inherit}
.panel input[type=color]{width:100%;height:38px;border:1px solid #ccc;border-radius:10px;padding:2px;background:#fff}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 13px;border-radius:99px;border:1px solid #bbb;background:#fff;font:inherit;cursor:pointer}
.chip.sc{background:#3b2314;color:#fbe8cc;border-color:#3b2314;font-family:Georgia,serif;letter-spacing:.1em}
.pb{padding:12px;width:100%;border:0;border-radius:12px;background:#222;color:#fff;font:600 15px system-ui;margin-top:10px;cursor:pointer}
.pb.g{background:#eee;color:#222}
.note{font-size:12px;color:#666;margin:8px 0 0;line-height:1.4}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:99px;font:14px system-ui;display:none;z-index:30;max-width:90%;text-align:center}
.modal{background:var(--card);color:var(--text);font-family:var(--font);border-radius:var(--r);padding:22px;width:min(340px,92%);margin:auto;text-align:center;max-height:85vh;overflow:auto}
.ssid{font-size:20px;font-weight:600;margin-bottom:12px}
.pass{font:600 22px ui-monospace,monospace;margin:8px 0 14px;word-break:break-all}
#qr svg{width:150px;height:150px}
</style>

 if(hrs)h+=`<div class="row hrs"><span class="ic">${IC.clock}</span><span class="lb"><small>${t.hours}</small>${esc(hrs)}</span></div>`;
 $('#page').innerHTML=h;
 document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{L=b.dataset.l;try{localStorage.setItem('cafe-lang',L)}catch(e){}render()});
 const w=$('#wf');if(w)w.onclick=wifi;const m=$('#mn');if(m)m.onclick=menuModal;
 $('#lg').onclick=()=>{logoTap.n=(Date.now()-logoTap.t>3000?0:logoTap.n)+1;logoTap.t=Date.now();if(logoTap.n>=5){logoTap.n=0;openPanel()}}}
const logoTap={n:0,t:0};
document.getElementById('app').innerHTML='<div id="page"></div><div class="sheet" id="sh"><div class="panel" id="pn"></div></div><div class="sheet" id="wm"></div>';
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3200)}
function modal(html){const m=$('#wm');m.innerHTML=`<div class="modal">${html}<button class="btn o" id="cl">${T[L].close}</button></div>`;m.classList.add('on');$('#cl').onclick=()=>m.classList.remove('on')}
function menuModal(){modal(`<div class="ssid">${T[L].menu}</div>`+tx('menu').split('\n').filter(x=>x.trim()).map(l=>{const [a,...b]=l.split(/\s+[—–-]\s+/);return`<div class="mi"><span>${esc(a)}</span><b>${esc(b.join(' — '))}</b></div>`}).join('')+'<div style="height:14px"></div>')}
function wifi(){const t=T[L];
 try{navigator.clipboard.writeText(S.pass)}catch(e){}
 modal(`<small style="opacity:.6">${t.net}</small><div class="ssid">${esc(S.ssid)}</div><small style="opacity:.6">${t.pass}${S.pass?t.copied:''}</small><div class="pass">${esc(S.pass)||t.nopass}</div><div id="qr"></div><p style="font-size:12px;opacity:.65;margin:8px 0 14px">${t.hint}</p><button class="btn" id="cp">${t.copy}</button>`);
 try{const q=qrcode(0,'M');q.addData(`WIFI:T:${S.pass?'WPA':'nopass'};S:${S.ssid};P:${S.pass};;`);q.make();$('#qr').innerHTML=q.createSvgTag(4,0)}catch(e){}
 $('#cp').onclick=()=>{try{navigator.clipboard.writeText(S.pass);toast('OK')}catch(e){}}}
let authed=false,EL='ru';
function openPanel(){$('#sh').classList.add('on');authed?editor():pinView()}
function close(){$('#sh').classList.remove('on');if(location.hash==='#admin')history.replaceState(null,'',location.pathname+location.search)}
function pinView(){$('#pn').innerHTML=`<h3>Меню владельца</h3><label>PIN-код (по умолчанию 0000)</label><input type="password" id="pi" inputmode="numeric"><button class="pb" id="po">Войти</button><button class="pb g" id="pc">Закрыть</button>`;
 $('#po').onclick=()=>{if(S.server?$('#pi').value:$('#pi').value===S.pin){authPin=$('#pi').value;authed=true;editor()}else toast('Неверный PIN')};$('#pc').onclick=close}
function fld(l,id,v,t='text',ph=''){return`<label>${l}</label><input type="${t}" id="${id}" value="${esc(v)}" placeholder="${esc(ph)}">`}
function editor(){const t=S.th,I=S.i18n[EL];L=EL;render();
 $('#pn').innerHTML=`<h3>Настройки страницы</h3>
 <label>Язык, который редактируете</label><select id="el"><option value="ru">Русский</option><option value="az">Azərbaycanca</option><option value="en">English</option></select>
 <h4>Тексты (для выбранного языка)</h4>${fld('Название','f_name',I.name)}${fld('Подпись','f_tag',I.tag)}${fld('Акция / подарок за отзыв','f_promo',I.promo,'text','Зубная щётка за отзыв')}${fld('Режим работы','f_hours',I.hours,'text','Ежедневно 9:00–22:00')}
 <label>Меню (по строке: Название — цена)</label><textarea id="f_menu" rows="6">${esc(I.menu)}</textarea>
 <h4>Стиль</h4><div class="chips">${Object.keys(P).map(k=>`<button class="chip ${k==='sancrema'?'sc':''}" data-p="${k}">${k==='sancrema'?'SAN CREMA':P[k].n}</button>`).join('')}</div>
 <div class="g2"><div><label>Фон</label><input type="color" id="c_bg" value="${t.bg}"></div><div><label>Карточки</label><input type="color" id="c_card" value="${t.card}"></div><div><label>Текст</label><input type="color" id="c_text" value="${t.text}"></div><div><label>Акцент</label><input type="color" id="c_accent" value="${t.accent}"></div></div>
 <div class="g2"><div><label>Шрифт</label><select id="c_font"><option value="serif">Классика</option><option value="sans">Современный</option><option value="round">Мягкий</option><option value="cap">San Crema (капс)</option></select></div><div><label>Кнопки</label><select id="c_btn"><option value="fill">Залитые</option><option value="outline">Контурные</option></select></div></div>
 <label>Фон-текстура</label><select id="c_deco"><option value="ribs">Рифлёная стена (как на фото)</option><option value="glow">Мягкое свечение</option><option value="none">Однотонный</option></select>
 <label>Скругление: <span id="rv">${t.radius}</span>px</label><input type="range" id="c_r" min="0" max="32" value="${t.radius}" style="width:100%">
 <h4>Логотип</h4><div class="chips"><button class="chip" id="lg1">Чашка</button><button class="chip" id="lg2">San Crema</button><label class="chip" style="margin:0">Загрузить фото<input type="file" id="lf" accept="image/*" hidden></label></div>
 <h4>Wi-Fi</h4>${fld('Название сети','f_ssid',S.ssid)}${fld('Пароль','f_pass',S.pass)}
 <h4>Ссылки</h4>${fld('Отзыв Google','f_google',S.google,'url','https://g.page/r/…/review')}${fld('Отзыв Яндекс','f_yandex',S.yandex,'url','https://yandex.ru/maps/org/…/reviews')}${fld('Отзыв 2ГИС','f_gis',S.gis,'url')}${fld('Чаевые','f_tips',S.tips,'url')}
 ${Object.keys(SOC).map(k=>fld(SOC[k][0]+(k==='phone'||k==='whatsapp'?' (номер)':k==='web'||k==='map'?' (ссылка)':' (ник или ссылка)'),'s_'+k,S.soc[k])).join('')}
 <h4>Безопасность</h4>${fld('PIN владельца','f_pin',S.pin)}
 <h4>Автосохранение на GitHub</h4>${fld('Репозиторий (логин/название)','f_ghrepo',S.gh.repo,'text','ivan/cafe')}${fld('Ветка','f_ghbr',S.gh.branch)}<label>Токен GitHub (хранится только на этом телефоне)</label><input type="password" id="f_ghtk" value="${esc(ghtk())}"><p class="note">Один раз: GitHub → Settings → Developer settings → Fine-grained tokens → Generate. Доступ только к этому репозиторию, Contents: Read and write. Вставьте токен сюда. После этого «Сохранить» само записывает config.json в репозиторий, а index.html не меняется.</p>
 <h4>Или Google-сервер (необязательно)</h4>${fld('Адрес сервера (Apps Script)','f_server',S.server,'url','https://script.google.com/macros/s/…/exec')}<button class="pb g" id="gas">Скопировать код сервера</button><p class="note">Один раз: script.google.com → Новый проект → вставить код → в начале замените PIN на свой → Развернуть → Веб-приложение → доступ «Все» → скопировать адрес сюда → скачать index.html и загрузить в GitHub. Дальше правки сохраняются сами. При включённом сервере вход по PIN из кода сервера.</p>
 <h4>Сохранение</h4>
 <button class="pb" id="sv">Сохранить на этом устройстве</button>
 <button class="pb" id="dl">Скачать index.html (для GitHub)</button>
 <button class="pb g" id="cpy">Скопировать код страницы</button>
 <button class="pb g" id="cc">Закрыть</button>
 <p class="note">На GitHub Pages изменения не сохраняются сами. Внесите правки, скачайте index.html и замените им файл в репозитории. Через минуту их увидят все. Без этого правки видны только на этом телефоне.</p>`;
 $('#el').value=EL;$('#c_font').value=t.font;$('#c_btn').value=t.btn;$('#c_deco').value=t.deco||'ribs';
 $('#el').onchange=e=>{EL=e.target.value;editor()};
 document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const p=P[b.dataset.p];Object.assign(S.th,{preset:b.dataset.p,bg:p.bg,card:p.card,text:p.text,accent:p.accent,font:p.font});
  if(b.dataset.p==='sancrema'){LANGS.forEach(l=>{S.i18n[l].name='SAN CREMA';S.i18n[l].tag='coffee · bakery'});S.logo='sc';S.th.btn='outline';S.th.radius=6;S.th.deco='glow'}
  editor()});
 ['bg','card','text','accent'].forEach(k=>$('#c_'+k).oninput=e=>{S.th[k]=e.target.value;render()});
 $('#c_font').onchange=e=>{S.th.font=e.target.value;render()};$('#c_btn').onchange=e=>{S.th.btn=e.target.value;render()};$('#c_deco').onchange=e=>{S.th.deco=e.target.value;render()};
 $('#c_r').oninput=e=>{S.th.radius=+e.target.value;$('#rv').textContent=e.target.value;render()};
 const bind=(id,fn)=>$(id).oninput=e=>{fn(e.target.value);render()};
 ['name','tag','promo','hours','menu'].forEach(k=>bind('#f_'+k,v=>S.i18n[EL][k]=v));
 bind('#f_ssid',v=>S.ssid=v);bind('#f_pass',v=>S.pass=v);['google','yandex','gis','tips'].forEach(k=>bind('#f_'+k,v=>S[k]=v));
 Object.keys(SOC).forEach(k=>bind('#s_'+k,v=>S.soc[k]=v));
 $('#f_pin').oninput=e=>S.pin=e.target.value||'0000';
 $('#lg1').onclick=()=>{S.logo='cup';render()};$('#lg2').onclick=()=>{S.logo='sc';render()};
 $('#lf').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d'),s=Math.min(im.width,im.height);x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,256,256);S.img=c.toDataURL('image/jpeg',.85);S.logo='img';render()};im.src=URL.createObjectURL(f)};
 $('#f_ghrepo').oninput=e=>{S.gh.repo=e.target.value.trim()};$('#f_ghbr').oninput=e=>{S.gh.branch=e.target.value.trim()||'main'};$('#f_ghtk').oninput=e=>{try{localStorage.setItem('cafe-gh',e.target.value.trim())}catch(x){}};$('#f_server').oninput=e=>{S.server=e.target.value.trim()};$('#gas').onclick=async()=>{try{await navigator.clipboard.writeText(GAS);toast('Код сервера скопирован')}catch(e){toast('Не удалось скопировать')}};$('#cc').onclick=close;$('#sv').onclick=save;$('#dl').onclick=dl;$('#cpy').onclick=cpy}
function buildHtml(){S.v=Date.now();const c=document.documentElement.cloneNode(true);
 c.querySelector('#app').innerHTML='';c.querySelector('#theme').textContent='';c.querySelector('#toast').style.display='none';
 c.querySelector('#cfg').textContent=JSON.stringify(S).replace(/</g,'\\u003c');c.querySelector('body').removeAttribute('class');c.removeAttribute('lang');c.setAttribute('lang','ru');
 return'<!DOCTYPE html>\n'+c.outerHTML}
async function save(){const h=buildHtml();
 try{localStorage.setItem('cafe-nfc-local',JSON.stringify(S))}catch(e){}
 try{if(!(window.claude&&claude.use))throw 0;const a=await claude.use('artifact');if(!a)throw 0;toast('Публикую…');await a.publish(h)}
 catch(e){toast('Сохранено на этом устройстве. Для всех: скачайте файл и загрузите на GitHub.')}
 if(S.server)push();else if(S.gh&&S.gh.repo&&ghtk())ghPush()}
const ghtk=()=>{try{return localStorage.getItem('cafe-gh')||''}catch(e){return''}};
async function ghPush(){const g=S.gh,tk=ghtk(),p='config.json',b=g.branch||'main';
 const d=JSON.parse(JSON.stringify(S));delete d.pin;delete d.server;delete d.gh;
 const api=`https://api.github.com/repos/${g.repo}/contents/${p}`,h={Authorization:'Bearer '+tk,Accept:'application/vnd.github+json'};
 try{toast('Сохраняю на GitHub…');let sha;const r0=await fetch(api+'?ref='+encodeURIComponent(b),{headers:h});if(r0.ok)sha=(await r0.json()).sha;
 const body={message:'Update cafe settings',content:btoa(unescape(encodeURIComponent(JSON.stringify(d)))),branch:b};if(sha)body.sha=sha;
 const r=await fetch(api,{method:'PUT',headers:h,body:JSON.stringify(body)});
 toast(r.ok?'Сохранено на GitHub. Страница обновится примерно через минуту':'Ошибка GitHub '+r.status+': проверьте репозиторий и токен')}catch(e){toast('GitHub недоступен')}}
async function push(){const d=JSON.parse(JSON.stringify(S));delete d.pin;delete d.server;d.v=Date.now();
 try{const r=await fetch(S.server,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({pin:authPin,data:d})});const j=await r.json();toast(j.ok?'Сохранено на сервере. Увидят все':'Неверный PIN сервера')}catch(e){toast('Сервер недоступен')}}
async function pull(){const u=S.server?S.server+(S.server.includes('?')?'&':'?')+'t='+Date.now():'config.json?t='+Date.now();
 try{const r=await fetch(u,{cache:'no-store'});const j=await r.json();if(j&&j.th&&(S.server||(j.v||0)>=(S.v||0))){const sv=S.server,pn=S.pin,gh=S.gh;merge(j);S.server=sv;S.pin=pn;S.gh=gh;render()}}catch(e){}}
function dl(){const h=buildHtml();try{localStorage.setItem('cafe-nfc-local',JSON.stringify(S))}catch(e){}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h],{type:'text/html'}));a.download='index.html';document.body.appendChild(a);a.click();a.remove();toast('index.html скачан')}
async function cpy(){try{await navigator.clipboard.writeText(buildHtml());toast('Код скопирован')}catch(e){toast('Не удалось скопировать')}}
$('#sh').onclick=e=>{if(e.target.id==='sh')close()};$('#wm').onclick=e=>{if(e.target.id==='wm')e.target.classList.remove('on')};
addEventListener('hashchange',()=>{if(location.hash==='#admin')openPanel()});
render();pull();if(location.hash==='#admin')openPanel();
</script>
